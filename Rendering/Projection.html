<!doctype html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Triangle Projection Renderer</title>
	<style>
		:root {
			--bg-0: #071324;
			--bg-1: #112743;
			--panel: rgba(9, 18, 35, 0.74);
			--panel-border: rgba(255, 255, 255, 0.14);
			--text: #ecf4ff;
			--muted: #9eb4ce;
			--accent: #ff9f5a;
			--triangle: #53f3d3;
			--projection: #ff6f6f;
			--camera: #ffd166;
			--plane: #5aa9ff;
		}

		* {
			box-sizing: border-box;
		}

		html,
		body {
			margin: 0;
			width: 100%;
			min-height: 100%;
			color: var(--text);
			font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
			background:
				radial-gradient(1200px 620px at 12% 8%, rgba(51, 111, 186, 0.26), transparent 66%),
				radial-gradient(1000px 520px at 88% 100%, rgba(255, 152, 74, 0.2), transparent 68%),
				linear-gradient(145deg, var(--bg-0), var(--bg-1));
		}

		.page {
			width: min(1400px, 96vw);
			margin: 16px auto;
			display: grid;
			gap: 14px;
		}

		.topbar {
			display: flex;
			flex-wrap: wrap;
			justify-content: space-between;
			align-items: center;
			gap: 12px;
			padding: 12px 14px;
			border: 1px solid var(--panel-border);
			border-radius: 14px;
			background: var(--panel);
			backdrop-filter: blur(4px);
		}

		.title {
			margin: 0;
			font-size: clamp(18px, 1.6vw, 24px);
			letter-spacing: 0.02em;
		}

		.subtitle {
			margin: 4px 0 0;
			color: var(--muted);
			font-size: 14px;
		}

		.toggles {
			display: grid;
			grid-template-columns: repeat(4, minmax(170px, 1fr));
			gap: 8px 10px;
			width: 100%;
			margin-top: 8px;
		}

		.points-editor {
			display: grid;
			grid-template-columns: repeat(3, minmax(164px, 1fr));
			gap: 10px;
			width: 100%;
			margin-top: 8px;
		}

		.point-group {
			border: 1px solid rgba(255, 255, 255, 0.14);
			border-radius: 10px;
			padding: 8px;
			background: rgba(6, 14, 28, 0.35);
		}

		.point-title {
			margin: 0 0 6px;
			font-size: 12px;
			letter-spacing: 0.04em;
			text-transform: uppercase;
			color: var(--muted);
		}

		.point-row {
			display: grid;
			grid-template-columns: 18px 1fr;
			align-items: center;
			gap: 6px;
			margin-bottom: 6px;
		}

		.point-row:last-child {
			margin-bottom: 0;
		}

		.point-row label {
			font-size: 12px;
			color: var(--muted);
		}

		.point-row input {
			width: 100%;
			border: 1px solid rgba(255, 255, 255, 0.18);
			border-radius: 8px;
			padding: 6px 8px;
			background: rgba(8, 18, 35, 0.76);
			color: var(--text);
			font-size: 13px;
			cursor: ew-resize;
		}

		.point-row input.dragging {
			border-color: rgba(255, 159, 90, 0.8);
			box-shadow: 0 0 0 1px rgba(255, 159, 90, 0.35);
		}

		.toggle {
			display: flex;
			align-items: center;
			gap: 8px;
			font-size: 14px;
			user-select: none;
		}

		.toggle input {
			margin: 0;
			accent-color: var(--accent);
		}

		.split {
			display: grid;
			grid-template-columns: 1fr 1fr;
			gap: 14px;
			min-height: min(70vh, 760px);
		}

		.panel {
			position: relative;
			border: 1px solid var(--panel-border);
			border-radius: 16px;
			background: var(--panel);
			overflow: hidden;
		}

		.panel canvas {
			width: 100%;
			height: 100%;
			display: block;
		}

		.panel-label {
			position: absolute;
			left: 12px;
			top: 12px;
			z-index: 1;
			padding: 6px 10px;
			border-radius: 999px;
			border: 1px solid rgba(255, 255, 255, 0.16);
			font-size: 12px;
			letter-spacing: 0.06em;
			text-transform: uppercase;
			background: rgba(9, 18, 35, 0.72);
			color: #dce9fa;
		}

		.hint {
			position: absolute;
			left: 12px;
			bottom: 12px;
			z-index: 1;
			margin: 0;
			padding: 8px 10px;
			border-radius: 10px;
			border: 1px solid rgba(255, 255, 255, 0.12);
			background: rgba(9, 18, 35, 0.72);
			font-size: 12px;
			color: var(--muted);
		}

		@media (max-width: 980px) {
			.split {
				grid-template-columns: 1fr;
				min-height: auto;
			}

			.panel {
				min-height: 380px;
			}

			.toggles {
				grid-template-columns: repeat(2, minmax(160px, 1fr));
			}

			.points-editor {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
<main class="page">
	<section class="topbar">
		<div>
			<h1 class="title">Triangle Projection Walkthrough</h1>
			<p class="subtitle">Left: 3D scene. Right: projected render on the view plane.</p>
		</div>

		<div class="points-editor" aria-label="Triangle point coordinates">
			<section class="point-group">
				<p class="point-title">Vertex 1</p>
				<div class="point-row"><label for="p1x">x</label><input id="p1x" class="point-input" data-point="0" data-axis="0" type="number" step="0.1"></div>
				<div class="point-row"><label for="p1y">y</label><input id="p1y" class="point-input" data-point="0" data-axis="1" type="number" step="0.1"></div>
				<div class="point-row"><label for="p1z">z</label><input id="p1z" class="point-input" data-point="0" data-axis="2" type="number" step="0.1"></div>
			</section>

			<section class="point-group">
				<p class="point-title">Vertex 2</p>
				<div class="point-row"><label for="p2x">x</label><input id="p2x" class="point-input" data-point="1" data-axis="0" type="number" step="0.1"></div>
				<div class="point-row"><label for="p2y">y</label><input id="p2y" class="point-input" data-point="1" data-axis="1" type="number" step="0.1"></div>
				<div class="point-row"><label for="p2z">z</label><input id="p2z" class="point-input" data-point="1" data-axis="2" type="number" step="0.1"></div>
			</section>

			<section class="point-group">
				<p class="point-title">Vertex 3</p>
				<div class="point-row"><label for="p3x">x</label><input id="p3x" class="point-input" data-point="2" data-axis="0" type="number" step="0.1"></div>
				<div class="point-row"><label for="p3y">y</label><input id="p3y" class="point-input" data-point="2" data-axis="1" type="number" step="0.1"></div>
				<div class="point-row"><label for="p3z">z</label><input id="p3z" class="point-input" data-point="2" data-axis="2" type="number" step="0.1"></div>
			</section>
		</div>

		<div class="toggles" aria-label="Projection toggles">
			<label class="toggle"><input id="toggle-camera" type="checkbox">Show camera</label>
			<label class="toggle"><input id="toggle-plane" type="checkbox">Show view plane</label>
			<label class="toggle"><input id="toggle-lines" type="checkbox">Show projection lines</label>
			<label class="toggle"><input id="toggle-result" type="checkbox">Show result on view plane</label>
		</div>
	</section>

	<section class="split">
		<article class="panel">
			<span class="panel-label">3D Window</span>
			<canvas id="sceneCanvas" aria-label="3D scene with triangle camera and view plane"></canvas>
			<p class="hint">Drag to orbit. Wheel to zoom.</p>
		</article>

		<article class="panel">
			<span class="panel-label">Render Results</span>
			<canvas id="resultCanvas" aria-label="Projected triangle on view plane"></canvas>
			<p class="hint">Projection on the camera view plane (16:9).</p>
		</article>
	</section>
</main>

<script>
const sceneCanvas = document.getElementById("sceneCanvas");
const resultCanvas = document.getElementById("resultCanvas");

const toggleCamera = document.getElementById("toggle-camera");
const togglePlane = document.getElementById("toggle-plane");
const toggleLines = document.getElementById("toggle-lines");
const toggleResult = document.getElementById("toggle-result");

const sceneCtx = sceneCanvas.getContext("2d");
const resultCtx = resultCanvas.getContext("2d");
const pointInputs = Array.from(document.querySelectorAll(".point-input"));

const COLORS = {
	bgTop: "#0b1a30",
	bgBottom: "#132d4c",
	grid: "rgba(130, 170, 210, 0.16)",
	triangle: "#53f3d3",
	camera: "#ffd166",
	plane: "#5aa9ff",
	projectionLine: "rgba(255, 130, 130, 0.86)",
	projected: "#ff6f6f",
	text: "#e8f2ff",
	muted: "#8fa7c5"
};

const scene = {
	triangle: [
		[-1.0, -0.65, 0.0],
		[1.0, -0.65, 0.3],
		[0.0, 0.95, -0.15]
	],
	camera: [0.25, 0.35, 3.9],
	target: [0, 0, 0],
	up: [0, 1, 0],
	planeDistance: 1.5,
	planeWidth: 3.2,
	planeHeight: 1.8
};

const viewer = {
	yaw: 0.6,
	pitch: 0.38,
	distance: 6.8,
	minDistance: 3,
	maxDistance: 13,
	dragging: false,
	lastX: 0,
	lastY: 0
};

function add(a, b) {
	return [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
}

function subtract(a, b) {
	return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function scale(v, s) {
	return [v[0] * s, v[1] * s, v[2] * s];
}

function dot(a, b) {
	return a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
}

function cross(a, b) {
	return [
		a[1] * b[2] - a[2] * b[1],
		a[2] * b[0] - a[0] * b[2],
		a[0] * b[1] - a[1] * b[0]
	];
}

function length(v) {
	return Math.hypot(v[0], v[1], v[2]);
}

function normalize(v) {
	const len = length(v) || 1;
	return [v[0] / len, v[1] / len, v[2] / len];
}

function line(ctx, a, b, color, width = 1.5) {
	ctx.beginPath();
	ctx.moveTo(a.x, a.y);
	ctx.lineTo(b.x, b.y);
	ctx.strokeStyle = color;
	ctx.lineWidth = width;
	ctx.stroke();
}

function fillCircle(ctx, p, r, color) {
	ctx.beginPath();
	ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
	ctx.fillStyle = color;
	ctx.fill();
}

function setupCanvasSize(canvas, ctx) {
	const dpr = window.devicePixelRatio || 1;
	const width = Math.max(1, Math.floor(canvas.clientWidth * dpr));
	const height = Math.max(1, Math.floor(canvas.clientHeight * dpr));

	if (canvas.width !== width || canvas.height !== height) {
		canvas.width = width;
		canvas.height = height;
	}

	ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}

function computeCameraBasis(position, target, up) {
	const forward = normalize(subtract(target, position));
	const right = normalize(cross(forward, up));
	const realUp = normalize(cross(right, forward));
	return { forward, right, up: realUp };
}

function projectWorldPoint(point, view) {
	const rel = subtract(point, view.position);
	const x = dot(rel, view.right);
	const y = dot(rel, view.up);
	const z = dot(rel, view.forward);

	if (z <= 0.08) {
		return null;
	}

	const f = 1 / Math.tan(view.fov * 0.5);
	return {
		x: view.cx + (x / z) * f * view.scale,
		y: view.cy - (y / z) * f * view.scale,
		z
	};
}

function getViewerCamera(pivot) {
	const x = pivot[0] + viewer.distance * Math.cos(viewer.pitch) * Math.sin(viewer.yaw);
	const y = pivot[1] + viewer.distance * Math.sin(viewer.pitch);
	const z = pivot[2] + viewer.distance * Math.cos(viewer.pitch) * Math.cos(viewer.yaw);
	const position = [x, y, z];
	const basis = computeCameraBasis(position, pivot, [0, 1, 0]);
	return {
		position,
		...basis
	};
}

function getSceneProjectionData() {
	const cam = scene.camera;
	const target = scene.target;
	const basis = computeCameraBasis(cam, target, scene.up);
	const center = add(cam, scale(basis.forward, scene.planeDistance));
	const halfW = scene.planeWidth * 0.5;
	const halfH = scene.planeHeight * 0.5;

	const corners = [
		add(add(center, scale(basis.right, -halfW)), scale(basis.up, -halfH)),
		add(add(center, scale(basis.right, halfW)), scale(basis.up, -halfH)),
		add(add(center, scale(basis.right, halfW)), scale(basis.up, halfH)),
		add(add(center, scale(basis.right, -halfW)), scale(basis.up, halfH))
	];

	const projected = scene.triangle.map((v) => {
		const ray = subtract(v, cam);
		const denom = dot(ray, basis.forward);
		const t = scene.planeDistance / denom;
		const point = add(cam, scale(ray, t));
		const local = subtract(point, center);
		return {
			world: point,
			uv: {
				x: dot(local, basis.right),
				y: dot(local, basis.up)
			}
		};
	});

	return {
		basis,
		center,
		corners,
		projected
	};
}

function syncPointInputsFromScene() {
	for (const input of pointInputs) {
		const pointIndex = Number(input.dataset.point);
		const axisIndex = Number(input.dataset.axis);
		input.value = scene.triangle[pointIndex][axisIndex].toFixed(2);
	}
}

function bindPointInputs() {
	for (const input of pointInputs) {
		let dragState = null;

		function applyValue(pointIndex, axisIndex, value) {
			scene.triangle[pointIndex][axisIndex] = value;
			input.value = value.toFixed(2);
		}

		input.addEventListener("pointerdown", (event) => {
			if (event.button !== 0) {
				return;
			}

			const pointIndex = Number(input.dataset.point);
			const axisIndex = Number(input.dataset.axis);
			const startValue = Number.parseFloat(input.value);
			const step = Number.parseFloat(input.step);
			dragState = {
				pointIndex,
				axisIndex,
				pointerId: event.pointerId,
				startX: event.clientX,
				startValue: Number.isFinite(startValue) ? startValue : scene.triangle[pointIndex][axisIndex],
				step: Number.isFinite(step) ? step : 0.1,
				isDragging: false
			};

			input.classList.add("dragging");
			input.setPointerCapture(event.pointerId);
		});

		input.addEventListener("pointermove", (event) => {
			if (!dragState || event.pointerId !== dragState.pointerId) {
				return;
			}

			const deltaX = event.clientX - dragState.startX;
			if (!dragState.isDragging && Math.abs(deltaX) < 2) {
				return;
			}

			dragState.isDragging = true;
			event.preventDefault();

			const fineMultiplier = event.shiftKey ? 0.2 : 1;
			const fastMultiplier = event.ctrlKey ? 3 : 1;
			const sensitivity = dragState.step * 0.1 * fineMultiplier * fastMultiplier;
			const nextValue = dragState.startValue + deltaX * sensitivity;
			const rounded = Math.round(nextValue * 100) / 100;
			applyValue(dragState.pointIndex, dragState.axisIndex, rounded);
		});

		function stopDrag(event) {
			if (!dragState || event.pointerId !== dragState.pointerId) {
				return;
			}

			if (input.hasPointerCapture(event.pointerId)) {
				input.releasePointerCapture(event.pointerId);
			}
			input.classList.remove("dragging");
			dragState = null;
		}

		input.addEventListener("pointerup", stopDrag);
		input.addEventListener("pointercancel", stopDrag);

		input.addEventListener("input", () => {
			const pointIndex = Number(input.dataset.point);
			const axisIndex = Number(input.dataset.axis);
			const value = Number.parseFloat(input.value);
			if (Number.isFinite(value)) {
				applyValue(pointIndex, axisIndex, value);
			}
		});

		input.addEventListener("blur", () => {
			const pointIndex = Number(input.dataset.point);
			const axisIndex = Number(input.dataset.axis);
			const value = Number.parseFloat(input.value);
			if (!Number.isFinite(value)) {
				input.value = scene.triangle[pointIndex][axisIndex].toFixed(2);
				return;
			}

			applyValue(pointIndex, axisIndex, value);
		});
	}
}

function drawScenePanel() {
	const width = sceneCanvas.clientWidth;
	const height = sceneCanvas.clientHeight;
	const gradient = sceneCtx.createLinearGradient(0, 0, 0, height);
	gradient.addColorStop(0, COLORS.bgTop);
	gradient.addColorStop(1, COLORS.bgBottom);
	sceneCtx.fillStyle = gradient;
	sceneCtx.fillRect(0, 0, width, height);

	const projectionData = getSceneProjectionData();
	const viewerCam = getViewerCamera(projectionData.center);

	const view = {
		...viewerCam,
		fov: Math.PI / 3,
		cx: width * 0.5,
		cy: height * 0.55,
		scale: Math.min(width, height) * 0.34
	};

	const triScreen = scene.triangle.map((v) => projectWorldPoint(v, view));
	if (triScreen.every(Boolean)) {
		sceneCtx.beginPath();
		sceneCtx.moveTo(triScreen[0].x, triScreen[0].y);
		sceneCtx.lineTo(triScreen[1].x, triScreen[1].y);
		sceneCtx.lineTo(triScreen[2].x, triScreen[2].y);
		sceneCtx.closePath();
		sceneCtx.fillStyle = "rgba(83, 243, 211, 0.18)";
		sceneCtx.strokeStyle = COLORS.triangle;
		sceneCtx.lineWidth = 2.4;
		sceneCtx.fill();
		sceneCtx.stroke();
	}

	if (togglePlane.checked) {
		const planePoints = projectionData.corners.map((v) => projectWorldPoint(v, view));
		if (planePoints.every(Boolean)) {
			sceneCtx.beginPath();
			sceneCtx.moveTo(planePoints[0].x, planePoints[0].y);
			for (let i = 1; i < planePoints.length; i += 1) {
				sceneCtx.lineTo(planePoints[i].x, planePoints[i].y);
			}
			sceneCtx.closePath();
			sceneCtx.fillStyle = "rgba(90, 169, 255, 0.12)";
			sceneCtx.strokeStyle = "rgba(106, 186, 255, 0.95)";
			sceneCtx.lineWidth = 2;
			sceneCtx.fill();
			sceneCtx.stroke();
		}
	}

	if (toggleResult.checked) {
		const projectedOnPlane = projectionData.projected.map((entry) => projectWorldPoint(entry.world, view));
		if (projectedOnPlane.every(Boolean)) {
			sceneCtx.beginPath();
			sceneCtx.moveTo(projectedOnPlane[0].x, projectedOnPlane[0].y);
			sceneCtx.lineTo(projectedOnPlane[1].x, projectedOnPlane[1].y);
			sceneCtx.lineTo(projectedOnPlane[2].x, projectedOnPlane[2].y);
			sceneCtx.closePath();
			sceneCtx.fillStyle = "rgba(255, 111, 111, 0.2)";
			sceneCtx.strokeStyle = COLORS.projected;
			sceneCtx.lineWidth = 2.2;
			sceneCtx.fill();
			sceneCtx.stroke();
		}
	}

	if (toggleLines.checked) {
		const cameraScreenPoint = projectWorldPoint(scene.camera, view);
		for (let i = 0; i < 3; i += 1) {
			const a = projectWorldPoint(scene.triangle[i], view);
			const b = cameraScreenPoint;
			if (a && b) {
				line(sceneCtx, a, b, COLORS.projectionLine, 1.4);
			}
		}
	}

	if (toggleCamera.checked) {
		const camPoint = projectWorldPoint(scene.camera, view);
		if (camPoint) {
			fillCircle(sceneCtx, camPoint, 5.3, COLORS.camera);
			const lookPoint = projectWorldPoint(add(scene.camera, scale(projectionData.basis.forward, 0.75)), view);
			if (lookPoint) {
				line(sceneCtx, camPoint, lookPoint, "rgba(255, 209, 102, 0.9)", 2.1);
			}

			if (togglePlane.checked) {
				for (const corner of projectionData.corners) {
					const cornerScreen = projectWorldPoint(corner, view);
					if (cornerScreen) {
						line(sceneCtx, camPoint, cornerScreen, "rgba(255, 209, 102, 0.3)", 1);
					}
				}
			}
		}
	}

}

function drawResultPanel() {
	const width = resultCanvas.clientWidth;
	const height = resultCanvas.clientHeight;

	const gradient = resultCtx.createLinearGradient(0, 0, 0, height);
	gradient.addColorStop(0, "#101f35");
	gradient.addColorStop(1, "#173457");
	resultCtx.fillStyle = gradient;
	resultCtx.fillRect(0, 0, width, height);

	const margin = 52;
	const maxAreaWidth = Math.max(80, width - margin * 2);
	const maxAreaHeight = Math.max(80, height - margin * 2);
	const planeAspect = scene.planeWidth / scene.planeHeight;
	let areaWidth = maxAreaWidth;
	let areaHeight = areaWidth / planeAspect;

	if (areaHeight > maxAreaHeight) {
		areaHeight = maxAreaHeight;
		areaWidth = areaHeight * planeAspect;
	}

	const area = {
		x: (width - areaWidth) * 0.5,
		y: (height - areaHeight) * 0.5,
		w: areaWidth,
		h: areaHeight
	};

	resultCtx.strokeStyle = "rgba(154, 196, 238, 0.35)";
	resultCtx.lineWidth = 1;

	for (let i = 0; i <= 10; i += 1) {
		const t = i / 10;
		const x = area.x + t * area.w;
		const y = area.y + t * area.h;
		line(resultCtx, { x, y: area.y }, { x, y: area.y + area.h }, COLORS.grid, 1);
		line(resultCtx, { x: area.x, y }, { x: area.x + area.w, y }, COLORS.grid, 1);
	}

	resultCtx.strokeStyle = "rgba(113, 181, 255, 0.95)";
	resultCtx.lineWidth = 2;
	resultCtx.strokeRect(area.x, area.y, area.w, area.h);

	const halfW = scene.planeWidth * 0.5;
	const halfH = scene.planeHeight * 0.5;

	function planeToScreen(uv) {
		return {
			x: area.x + ((uv.x + halfW) / scene.planeWidth) * area.w,
			y: area.y + (1 - (uv.y + halfH) / scene.planeHeight) * area.h
		};
	}

	const projectionData = getSceneProjectionData();
	const projected2D = projectionData.projected.map((p) => planeToScreen(p.uv));

	if (toggleResult.checked) {
		resultCtx.beginPath();
		resultCtx.moveTo(projected2D[0].x, projected2D[0].y);
		resultCtx.lineTo(projected2D[1].x, projected2D[1].y);
		resultCtx.lineTo(projected2D[2].x, projected2D[2].y);
		resultCtx.closePath();
		resultCtx.fillStyle = "rgba(255, 111, 111, 0.24)";
		resultCtx.strokeStyle = COLORS.projected;
		resultCtx.lineWidth = 2.4;
		resultCtx.fill();
		resultCtx.stroke();

		for (const p of projected2D) {
			fillCircle(resultCtx, p, 4.4, COLORS.projected);
		}
	} else {
		resultCtx.fillStyle = "rgba(232, 242, 255, 0.82)";
		resultCtx.font = "600 14px Segoe UI";
		resultCtx.fillText("Result hidden: enable 'Show result on view plane'", area.x + 12, area.y + 24);
	}

	resultCtx.fillStyle = COLORS.muted;
	resultCtx.font = "12px Segoe UI";
	resultCtx.fillText("View plane bounds", area.x, area.y - 12);
}

function render() {
	setupCanvasSize(sceneCanvas, sceneCtx);
	setupCanvasSize(resultCanvas, resultCtx);
	drawScenePanel();
	drawResultPanel();
	requestAnimationFrame(render);
}

sceneCanvas.addEventListener("pointerdown", (event) => {
	viewer.dragging = true;
	viewer.lastX = event.clientX;
	viewer.lastY = event.clientY;
	sceneCanvas.setPointerCapture(event.pointerId);
});

sceneCanvas.addEventListener("pointermove", (event) => {
	if (!viewer.dragging) {
		return;
	}

	const dx = event.clientX - viewer.lastX;
	const dy = event.clientY - viewer.lastY;
	viewer.yaw -= dx * 0.007;
	viewer.pitch += dy * 0.007;
	viewer.pitch = Math.max(-1.45, Math.min(1.45, viewer.pitch));
	viewer.lastX = event.clientX;
	viewer.lastY = event.clientY;
});

function stopDrag(event) {
	if (!viewer.dragging) {
		return;
	}

	viewer.dragging = false;
	if (sceneCanvas.hasPointerCapture(event.pointerId)) {
		sceneCanvas.releasePointerCapture(event.pointerId);
	}
}

sceneCanvas.addEventListener("pointerup", stopDrag);
sceneCanvas.addEventListener("pointercancel", stopDrag);

sceneCanvas.addEventListener("wheel", (event) => {
	event.preventDefault();
	viewer.distance += event.deltaY * 0.004;
	viewer.distance = Math.max(viewer.minDistance, Math.min(viewer.maxDistance, viewer.distance));
}, { passive: false });

for (const input of [toggleCamera, togglePlane, toggleLines, toggleResult]) {
	input.addEventListener("change", () => {
		// State is read directly from each toggle during drawing.
	});
}

window.addEventListener("resize", () => {
	setupCanvasSize(sceneCanvas, sceneCtx);
	setupCanvasSize(resultCanvas, resultCtx);
});

bindPointInputs();
syncPointInputsFromScene();
requestAnimationFrame(render);
</script>
</body>
</html>
