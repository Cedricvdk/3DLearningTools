<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebGL Triangle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      cursor: grab;
      touch-action: none;
    }

    canvas.dragging {
      cursor: grabbing;
    }
  </style>
</head>
<body>
<script>
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);

const gl = canvas.getContext("webgl");
if (!gl) {
  throw new Error("WebGL is not supported in this browser.");
}

function createShader(glContext, type, source) {
  const shader = glContext.createShader(type);
  glContext.shaderSource(shader, source);
  glContext.compileShader(shader);

  if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
    const error = glContext.getShaderInfoLog(shader);
    glContext.deleteShader(shader);
    throw new Error("Shader compile failed: " + error);
  }

  return shader;
}

function createProgram(glContext, vertexSource, fragmentSource) {
  const vertexShader = createShader(glContext, glContext.VERTEX_SHADER, vertexSource);
  const fragmentShader = createShader(glContext, glContext.FRAGMENT_SHADER, fragmentSource);

  const program = glContext.createProgram();
  glContext.attachShader(program, vertexShader);
  glContext.attachShader(program, fragmentShader);
  glContext.linkProgram(program);

  if (!glContext.getProgramParameter(program, glContext.LINK_STATUS)) {
    const error = glContext.getProgramInfoLog(program);
    glContext.deleteProgram(program);
    throw new Error("Program link failed: " + error);
  }

  return program;
}

const vertexShaderSource = `
attribute vec3 aPosition;
uniform vec2 uRotation;
uniform float uAspect;

void main() {
  float cosY = cos(uRotation.y);
  float sinY = sin(uRotation.y);
  vec3 rotatedY = vec3(
    aPosition.x * cosY + aPosition.z * sinY,
    aPosition.y,
    -aPosition.x * sinY + aPosition.z * cosY
  );

  float cosX = cos(uRotation.x);
  float sinX = sin(uRotation.x);
  vec3 rotated = vec3(
    rotatedY.x,
    rotatedY.y * cosX - rotatedY.z * sinX,
    rotatedY.y * sinX + rotatedY.z * cosX
  );

  float distance = 2.5;
  float perspective = 1.6 / (distance - rotated.z);
  vec2 projected = vec2(
    rotated.x * perspective / uAspect,
    rotated.y * perspective
  );

  gl_Position = vec4(projected, 0.0, 1.0);
}
`;

const fragmentShaderSource = `
precision mediump float;
uniform vec4 uColor;

void main() {
  gl_FragColor = uColor;
}
`;

const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);
gl.useProgram(program);

const trianglePoints = [
  [0.0, 0.85, 0.0],
  [-0.8, -0.65, 0.0],
  [0.8, -0.65, 0.0]
];

function subtractVectors(a, b) {
  return [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
}

function crossProduct(a, b) {
  return [
    a[1] * b[2] - a[2] * b[1],
    a[2] * b[0] - a[0] * b[2],
    a[0] * b[1] - a[1] * b[0]
  ];
}

function normalize(vector) {
  const length = Math.hypot(vector[0], vector[1], vector[2]);
  return vector.map((value) => value / length);
}

const triangleVertices = new Float32Array(trianglePoints.flat());
const centroid = trianglePoints.reduce(
  (sum, point) => [sum[0] + point[0], sum[1] + point[1], sum[2] + point[2]],
  [0, 0, 0]
).map((value) => value / 3);
const faceNormal = normalize(
  crossProduct(
    subtractVectors(trianglePoints[1], trianglePoints[0]),
    subtractVectors(trianglePoints[2], trianglePoints[0])
  )
);
const normalLength = 0.65;
const normalTip = [
  centroid[0] + faceNormal[0] * normalLength,
  centroid[1] + faceNormal[1] * normalLength,
  centroid[2] + faceNormal[2] * normalLength
];
const normalVertices = new Float32Array([...centroid, ...normalTip]);

const triangleBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
gl.bufferData(gl.ARRAY_BUFFER, triangleVertices, gl.STATIC_DRAW);

const normalBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
gl.bufferData(gl.ARRAY_BUFFER, normalVertices, gl.STATIC_DRAW);

const aPosition = gl.getAttribLocation(program, "aPosition");
gl.enableVertexAttribArray(aPosition);

const uRotation = gl.getUniformLocation(program, "uRotation");
const uAspect = gl.getUniformLocation(program, "uAspect");
const uColor = gl.getUniformLocation(program, "uColor");
let rotationX = -0.45;
let rotationY = 0.45;
let isDragging = false;
let lastPointerX = 0;
let lastPointerY = 0;

canvas.addEventListener("pointerdown", (event) => {
  isDragging = true;
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
  canvas.classList.add("dragging");
  canvas.setPointerCapture(event.pointerId);
});

canvas.addEventListener("pointermove", (event) => {
  if (!isDragging) {
    return;
  }

  const deltaX = event.clientX - lastPointerX;
  const deltaY = event.clientY - lastPointerY;
  rotationY += deltaX * 0.01;
  rotationX += deltaY * 0.01;
  rotationX = Math.max(-1.4, Math.min(1.4, rotationX));
  lastPointerX = event.clientX;
  lastPointerY = event.clientY;
});

function stopDragging(event) {
  if (!isDragging) {
    return;
  }

  isDragging = false;
  canvas.classList.remove("dragging");
  if (canvas.hasPointerCapture(event.pointerId)) {
    canvas.releasePointerCapture(event.pointerId);
  }
}

canvas.addEventListener("pointerup", stopDragging);
canvas.addEventListener("pointercancel", stopDragging);

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const width = Math.floor(window.innerWidth * dpr);
  const height = Math.floor(window.innerHeight * dpr);

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
}

function render() {
  resize();

  gl.clearColor(0.04, 0.06, 0.12, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform2f(uRotation, rotationX, rotationY);
  gl.uniform1f(uAspect, canvas.width / canvas.height);

  gl.bindBuffer(gl.ARRAY_BUFFER, triangleBuffer);
  gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
  gl.uniform4f(uColor, 0.0, 1.0, 0.8, 1.0);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
  gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);
  gl.uniform4f(uColor, 1.0, 0.45, 0.2, 1.0);
  gl.drawArrays(gl.LINES, 0, 2);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

window.addEventListener("resize", resize);
</script>

</body>
</html>
