<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>WebGL Triangle</title>
  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b1020;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
<script>
const canvas = document.createElement("canvas");
document.body.appendChild(canvas);

const gl = canvas.getContext("webgl");
if (!gl) {
  throw new Error("WebGL is not supported in this browser.");
}

function createShader(glContext, type, source) {
  const shader = glContext.createShader(type);
  glContext.shaderSource(shader, source);
  glContext.compileShader(shader);

  if (!glContext.getShaderParameter(shader, glContext.COMPILE_STATUS)) {
    const error = glContext.getShaderInfoLog(shader);
    glContext.deleteShader(shader);
    throw new Error("Shader compile failed: " + error);
  }

  return shader;
}

function createProgram(glContext, vertexSource, fragmentSource) {
  const vertexShader = createShader(glContext, glContext.VERTEX_SHADER, vertexSource);
  const fragmentShader = createShader(glContext, glContext.FRAGMENT_SHADER, fragmentSource);

  const program = glContext.createProgram();
  glContext.attachShader(program, vertexShader);
  glContext.attachShader(program, fragmentShader);
  glContext.linkProgram(program);

  if (!glContext.getProgramParameter(program, glContext.LINK_STATUS)) {
    const error = glContext.getProgramInfoLog(program);
    glContext.deleteProgram(program);
    throw new Error("Program link failed: " + error);
  }

  return program;
}

const vertexShaderSource = `
attribute vec2 aPosition;
uniform float uAngle;

void main() {
  float c = cos(uAngle);
  float s = sin(uAngle);
  vec2 rotated = vec2(
    aPosition.x * c - aPosition.y * s,
    aPosition.x * s + aPosition.y * c
  );
  gl_Position = vec4(rotated, 0.0, 1.0);
}
`;

const fragmentShaderSource = `
precision mediump float;

void main() {
  gl_FragColor = vec4(0.0, 1.0, 0.8, 1.0);
}
`;

const program = createProgram(gl, vertexShaderSource, fragmentShaderSource);
gl.useProgram(program);

const vertices = new Float32Array([
   0.0,  0.75,
  -0.75, -0.75,
   0.75, -0.75
]);

const buffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
gl.bufferData(gl.ARRAY_BUFFER, vertices, gl.STATIC_DRAW);

const aPosition = gl.getAttribLocation(program, "aPosition");
gl.enableVertexAttribArray(aPosition);
gl.vertexAttribPointer(aPosition, 2, gl.FLOAT, false, 0, 0);

const uAngle = gl.getUniformLocation(program, "uAngle");

function resize() {
  const dpr = window.devicePixelRatio || 1;
  const width = Math.floor(window.innerWidth * dpr);
  const height = Math.floor(window.innerHeight * dpr);

  if (canvas.width !== width || canvas.height !== height) {
    canvas.width = width;
    canvas.height = height;
    gl.viewport(0, 0, canvas.width, canvas.height);
  }
}

function render(timeMs) {
  resize();

  const angle = timeMs * 0.001;
  gl.clearColor(0.04, 0.06, 0.12, 1.0);
  gl.clear(gl.COLOR_BUFFER_BIT);

  gl.uniform1f(uAngle, angle);
  gl.drawArrays(gl.TRIANGLES, 0, 3);

  requestAnimationFrame(render);
}

requestAnimationFrame(render);

window.addEventListener("resize", resize);
</script>

</body>
</html>
